# Create each job in Jobs & Pipelines -> Create job -> (⋮) Edit as YAML, one block at a time.
# Replace <REPO> with your Git folder path, e.g. /Workspace/Users/you@uni.edu/airbnb-roalda
# Databricks Free Edition uses serverless compute automatically.

# ---------------------------------------------------------------------------
# Job 1: the per-city pipeline. ONE definition; the city is a parameter.
# ---------------------------------------------------------------------------
resources:
  jobs:
    airbnb_city_pipeline:
      name: airbnb_city_pipeline
      max_concurrent_runs: 1
      parameters:
        - name: city
          default: new-orleans
        - name: snapshot_date        # empty = latest on Inside Airbnb
          default: ""
        - name: download             # "false" = use a file uploaded to the raw volume
          default: "true"
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: <REPO>/notebooks/01_bronze_ingest
        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task:
            notebook_path: <REPO>/notebooks/02_silver_clean
        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task:
            notebook_path: <REPO>/notebooks/03_gold_city


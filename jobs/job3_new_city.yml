# Job 3: a new client city. Same pipeline (Job 1), frozen week-1 model, no training.
# Replace <REPO> (your Git folder path) and <JOB_1_ID> (id of airbnb_city_pipeline), then paste via
# Jobs & Pipelines -> Create job -> (⋮) Edit as YAML.
resources:
  jobs:
    airbnb_new_city:
      name: airbnb_new_city
      parameters:
        - name: city
          default: nashville
        - name: model_alias
          default: week1
        - name: run_label
          default: c_first_run
      tasks:
        - task_key: city_pipeline
          run_job_task:
            job_id: <JOB_1_ID>
            job_parameters:
              city: "{{job.parameters.city}}"
        - task_key: score
          depends_on: [{task_key: city_pipeline}]
          notebook_task:
            notebook_path: <REPO>/notebooks/05_score_city
